name: Build Android release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the obsolete SDK package "tools".
          # Install platform-tools here; the next step installs the required
          # Android platform and build-tools versions explicitly.
          packages: platform-tools

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor, app assets, and create web bundle
        env:
          MANGA_READER_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Configure stable release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release-signing.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-signing.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            node scripts/configure-android-test-release.mjs
          else
            echo "Release signing secrets are not configured; using the temporary CI debug key. This APK cannot update installations signed with a different key."
            node scripts/configure-android-test-release.mjs
          fi

      - name: Configure local release signing for build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/configure-android-test-release.mjs

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/manga-reader.apk

      - name: Publish release APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-release-apk
          path: android/app/build/outputs/apk/release/manga-reader.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs as a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Manga Reader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/manga-reader.apk
