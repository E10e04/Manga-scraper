name: Build Android test and release APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 defaults to the obsolete SDK package "tools".
          # Install platform-tools here; the next step installs the required
          # Android platform and build-tools versions explicitly.
          packages: platform-tools

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor, app assets, and create web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
          node scripts/configure-android-test-release.mjs

      - name: Build installable debug and release APKs
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon -p android assembleDebug assembleRelease

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs as a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Manga Reader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
